name: Test Docker Container

on:
  push:
    branches: [ main, voice-functionality-no-packages ]
    paths: 
      - 'cerebrium/**'
      - 'livekit-server/**'
      - 'livekit-token-server/**'
      - 'sesame-tts/**'
      - 'whisper-stt/**'
      - '.github/workflows/test-docker.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'cerebrium/**'
      - 'livekit-server/**'
  workflow_dispatch:

jobs:
  test-ollama-container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Docker image
      run: |
        cd cerebrium
        docker build --progress=plain --no-cache -t gmail-voice-assistant:test .
        
    - name: Test container startup
      run: |
        # Start container in background
        docker run -d --name test-container \
          -p 8600:8600 \
          -p 11434:11434 \
          gmail-voice-assistant:test
          
        # Wait for container to start
        sleep 30
        
        # Check if container is still running
        if docker ps | grep -q test-container; then
          echo "✅ Container started successfully"
        else
          echo "❌ Container failed to start"
          docker logs test-container
          exit 1
        fi
        
    - name: Test Ollama availability
      run: |
        # Wait up to 2 minutes for Ollama to be ready
        timeout=120
        elapsed=0
        
        while [ $elapsed -lt $timeout ]; do
          if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "✅ Ollama is responding"
            curl -s http://localhost:11434/api/tags
            break
          fi
          echo "⏳ Waiting for Ollama... ($elapsed/$timeout seconds)"
          sleep 10
          elapsed=$((elapsed + 10))
        done
        
        if [ $elapsed -ge $timeout ]; then
          echo "❌ Ollama failed to start within timeout"
          docker logs test-container
          exit 1
        fi
        
    - name: Test model availability
      run: |
        # Check if llama3.2:1b model is available
        if curl -s http://localhost:11434/api/tags | grep -q "llama3.2:1b"; then
          echo "✅ llama3.2:1b model is available"
        else
          echo "❌ llama3.2:1b model not found"
          echo "Available models:"
          curl -s http://localhost:11434/api/tags
          exit 1
        fi
        
    - name: Test voice agent port
      run: |
        # Check if port 8600 is responding (voice agent)
        timeout=60
        elapsed=0
        
        while [ $elapsed -lt $timeout ]; do
          if curl -s http://localhost:8600/health > /dev/null 2>&1 || netstat -ln | grep -q ":8600 "; then
            echo "✅ Voice agent port 8600 is active"
            break
          fi
          echo "⏳ Waiting for voice agent... ($elapsed/$timeout seconds)"
          sleep 5
          elapsed=$((elapsed + 5))
        done
        
        if [ $elapsed -ge $timeout ]; then
          echo "⚠️  Voice agent port 8600 not responding (this may be normal without LiveKit connection)"
        fi
        
    - name: Container logs and cleanup
      if: always()
      run: |
        echo "📋 Container logs:"
        docker logs test-container || true
        
        echo "📊 Container stats:"
        docker stats --no-stream test-container || true
        
        echo "🧹 Cleaning up..."
        docker stop test-container || true
        docker rm test-container || true

  test-livekit-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build LiveKit Docker image
      run: |
        cd livekit-server
        docker build --progress=plain --no-cache -t livekit-server:test .
        
    - name: Test LiveKit container startup
      run: |
        # Start container in background with required environment variables
        docker run -d --name livekit-test \
          -p 7880:7880 \
          -p 7881:7881 \
          -e LIVEKIT_API_KEY=testkey \
          -e LIVEKIT_API_SECRET=testsecret \
          livekit-server:test
          
        # Show immediate logs
        echo "📋 Initial container logs:"
        docker logs livekit-test || true
          
        # Wait for container to start
        sleep 15
        
        # Check if container is still running
        if docker ps | grep -q livekit-test; then
          echo "✅ LiveKit container started successfully"
        else
          echo "❌ LiveKit container failed to start"
          docker logs livekit-test
          exit 1
        fi
        
    - name: Test LiveKit server health
      run: |
        # Wait up to 1 minute for LiveKit to be ready
        timeout=60
        elapsed=0
        
        while [ $elapsed -lt $timeout ]; do
          if curl -s http://localhost:7880/ > /dev/null 2>&1; then
            echo "✅ LiveKit server is responding"
            break
          fi
          echo "⏳ Waiting for LiveKit server... ($elapsed/$timeout seconds)"
          sleep 5
          elapsed=$((elapsed + 5))
        done
        
        if [ $elapsed -ge $timeout ]; then
          echo "❌ LiveKit server failed to start within timeout"
          docker logs livekit-test
          exit 1
        fi
        
    - name: LiveKit logs and cleanup
      if: always()
      run: |
        echo "📋 LiveKit container logs:"
        docker logs livekit-test || true
        
        echo "🧹 Cleaning up..."
        docker stop livekit-test || true
        docker rm livekit-test || true

  test-token-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Token Server Docker image
      run: |
        cd livekit-token-server
        docker build --progress=plain --no-cache -t livekit-token-server:test .
        
    - name: Test Token Server container startup
      run: |
        # Start container in background with required environment variables
        docker run -d --name token-server-test \
          -p 8000:8000 \
          -e LIVEKIT_API_KEY=testkey \
          -e LIVEKIT_API_SECRET=testsecret \
          -e LIVEKIT_URL=ws://localhost:7880 \
          livekit-token-server:test
          
        # Show immediate logs
        echo "📋 Initial token server logs:"
        docker logs token-server-test || true
          
        # Wait for container to start
        sleep 10
        
        # Check if container is still running
        if docker ps | grep -q token-server-test; then
          echo "✅ Token server container started successfully"
        else
          echo "❌ Token server container failed to start"
          docker logs token-server-test
          exit 1
        fi
        
    - name: Test Token Server health endpoint
      run: |
        # Wait up to 30 seconds for server to be ready
        timeout=30
        elapsed=0
        
        while [ $elapsed -lt $timeout ]; do
          if curl -s http://localhost:8000/health > /dev/null 2>&1; then
            echo "✅ Token server health endpoint responding"
            curl -s http://localhost:8000/health | jq .
            break
          fi
          echo "⏳ Waiting for token server... ($elapsed/$timeout seconds)"
          sleep 2
          elapsed=$((elapsed + 2))
        done
        
        if [ $elapsed -ge $timeout ]; then
          echo "❌ Token server health endpoint failed to respond"
          docker logs token-server-test
          exit 1
        fi
        
    - name: Test token generation endpoint
      run: |
        # Test token generation
        echo "🔐 Testing token generation..."
        response=$(curl -s -X POST http://localhost:8000/token \
          -H "Content-Type: application/json" \
          -d '{
            "room": "test-room",
            "identity": "test-user",
            "name": "Test User"
          }')
        
        echo "Token generation response:"
        echo "$response" | jq .
        
        # Check if token was generated successfully
        if echo "$response" | jq -e '.token' > /dev/null; then
          echo "✅ Token generation successful"
        else
          echo "❌ Token generation failed"
          echo "Response: $response"
          exit 1
        fi
        
    - name: Test root endpoint
      run: |
        echo "📡 Testing root endpoint..."
        curl -s http://localhost:8000/ | jq .
        
    - name: Token server logs and cleanup
      if: always()
      run: |
        echo "📋 Token server logs:"
        docker logs token-server-test || true
        
        echo "🧹 Cleaning up..."
        docker stop token-server-test || true
        docker rm token-server-test || true

  test-speech-services:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build Whisper STT Docker image
      run: |
        cd whisper-stt
        docker build --progress=plain --no-cache -t whisper-stt:test .
        
    - name: Build Sesame TTS Docker image
      run: |
        cd sesame-tts
        docker build --progress=plain --no-cache -t sesame-tts:test .
        
    - name: Test Whisper STT container startup
      run: |
        # Start Whisper STT container
        docker run -d --name whisper-stt-test \
          -p 8002:8002 \
          -e WHISPER_MODEL=tiny \
          whisper-stt:test
          
        # Show immediate logs
        echo "📋 Initial Whisper STT logs:"
        docker logs whisper-stt-test || true
          
        # Wait for container to start
        sleep 30
        
        # Check if container is still running
        if docker ps | grep -q whisper-stt-test; then
          echo "✅ Whisper STT container started successfully"
        else
          echo "❌ Whisper STT container failed to start"
          docker logs whisper-stt-test
          exit 1
        fi
        
    - name: Test Whisper STT health endpoint
      run: |
        # Wait up to 60 seconds for STT server to be ready
        timeout=60
        elapsed=0
        
        while [ $elapsed -lt $timeout ]; do
          if curl -s http://localhost:8002/health > /dev/null 2>&1; then
            echo "✅ Whisper STT health endpoint responding"
            curl -s http://localhost:8002/health | jq .
            break
          fi
          echo "⏳ Waiting for Whisper STT... ($elapsed/$timeout seconds)"
          sleep 5
          elapsed=$((elapsed + 5))
        done
        
        if [ $elapsed -ge $timeout ]; then
          echo "❌ Whisper STT health endpoint failed to respond"
          docker logs whisper-stt-test
          exit 1
        fi
        
    - name: Test Sesame TTS container startup
      run: |
        # Start Sesame TTS container with HuggingFace token if available
        if [ -n "${{ secrets.HUGGINGFACE_TOKEN }}" ]; then
          echo "🔑 Using HuggingFace token for model access"
          docker run -d --name sesame-tts-test \
            -p 8001:8001 \
            -e HUGGINGFACE_HUB_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }} \
            sesame-tts:test
        else
          echo "⚠️ No HuggingFace token available - testing container startup only"
          docker run -d --name sesame-tts-test \
            -p 8001:8001 \
            sesame-tts:test
        fi
          
        # Show immediate logs
        echo "📋 Initial Sesame TTS logs:"
        docker logs sesame-tts-test || true
          
        # Wait for container
        sleep 20
        
        # Check container status (it may exit due to missing HF token, that's expected)
        echo "📊 Sesame TTS container status:"
        docker ps -a | grep sesame-tts-test || true
        
        echo "📋 Full Sesame TTS logs:"
        docker logs sesame-tts-test || true
        
    - name: Test service endpoints info
      run: |
        echo "🔍 Testing Whisper STT root endpoint..."
        curl -s http://localhost:8002/ | jq . || true
        
        echo "📊 Container resource usage:"
        docker stats --no-stream whisper-stt-test || true
        
    - name: Speech services logs and cleanup
      if: always()
      run: |
        echo "📋 Whisper STT final logs:"
        docker logs whisper-stt-test || true
        
        echo "📋 Sesame TTS final logs:"
        docker logs sesame-tts-test || true
        
        echo "🧹 Cleaning up..."
        docker stop whisper-stt-test sesame-tts-test || true
        docker rm whisper-stt-test sesame-tts-test || true